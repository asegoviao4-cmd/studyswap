<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicar Material</title>
<link rel="stylesheet" href="estilo.css">
</head>

<body>

<header class="header">
    <h1>📚 Publicar Material</h1>
</header>

<div class="container">

    <input id="titulo" type="text" placeholder="Título del material">

    <textarea id="descripcion" placeholder="Descripción"></textarea>

    <input id="precio" type="number" placeholder="Precio">

    <select id="categoria">
        <option>Ingeniería</option>
        <option>Medicina</option>
        <option>Derecho</option>
        <option>Administración</option>
    </select>

    <input id="pdf" type="file" accept=".pdf">

    <button onclick="publicar()">
        Publicar
    </button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAEHwoa9Nns1PaBdodk-ktIFw2APHI9V60",
    authDomain: "studyswap-3d053.firebaseapp.com",
    projectId: "studyswap-3d053",
    storageBucket: "studyswap-3d053.firebasestorage.app",
    appId: "1:765373094250:web:17a86d99e1ba2a6dadad13"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if (!user) {
        alert("No has iniciado sesión");
        window.location.href = "login.html";
    }

});
</script>

<script src="js/app.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
