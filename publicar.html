<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Material - StudySwap</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>📚 Publicar Material</h1>

    <input
        type="text"
        id="titulo"
        placeholder="Título del material"
    >

    <br><br>

    <textarea
        id="descripcion"
        placeholder="Descripción"
    ></textarea>

    <br><br>

    <input
        type="number"
        id="precio"
        placeholder="Precio"
    >

    <br><br>

    <input
        type="text"
        id="categoria"
        placeholder="Categoría"
    >

    <br><br>

    <input
        type="file"
        id="pdf"
        accept=".pdf"
    >
<br><br>

<input
    type="text"
    id="linkpdf"
    placeholder=:"Pega aquí el enlace de Google Drive"
/>

    <button onclick="publicar()">
        📤 Publicar Material
    </button>

    <br><br>

    <a href="catalogo.html">
        <button>📚 Ver Catálogo</button>
    </a>

    <script type="module" src="js/firebase.js"></script>

</body>
</html>
